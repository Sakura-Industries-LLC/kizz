# Kizz never panics: these macros panic when a write fails or a condition fails;
# print!, println!, eprint!, eprintln! and dbg! are caught by the workspace lints.
disallowed-macros = [
    { path = "std::assert", reason = "panics when the condition fails; return an error instead" },
    { path = "std::assert_eq", reason = "panics when the values differ; return an error instead" },
    { path = "std::assert_ne", reason = "panics when the values are equal; return an error instead" },
    { path = "std::debug_assert", reason = "panics in debug builds when the condition fails; return an error instead" },
    { path = "std::debug_assert_eq", reason = "panics in debug builds when the values differ; return an error instead" },
    { path = "std::debug_assert_ne", reason = "panics in debug builds when the values are equal; return an error instead" },
]
