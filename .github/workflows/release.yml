# When a `v*` tag is pushed, use `kizz build ci` to build the executable and
# documentation site, then publish the release and deploy the site.
#
# The tag must match the `kizz` crate version (`crates/kizz/Cargo.toml`),
# e.g. `v0.0.1`. Library crate versions are independent and not checked.
#
# Only x86_64 Linux is built: the tracer (`kizz-trace-linux`) supports no other
# architecture and refuses to compile for one. It is also written against glibc
# (its `ptrace` request type, rlimit resource type and `pthread_t`), so the
# binary targets glibc, not musl. Built on Ubuntu 24.04, it needs glibc 2.39 or
# newer on the machine that runs it.
#
# The site is deployed only after the release is published, so the published
# documentation always belongs to a released version.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.100.0"
  TARGET: x86_64-unknown-linux-gnu
  ZOLA_VERSION: "v0.23.6"
  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check-version:
    name: Check tag matches kizz version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Compare tag with crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kizz") | .version')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match kizz version ${version}"
            exit 1
          fi

  build:
    name: Run CI and build the release and docs
    needs: check-version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: "2026.11.3"
          install: false
          cache: false
          add_shims_to_path: false
      - name: Install Zola
        run: |
          archive="${RUNNER_TEMP}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "${archive}" \
            "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/${archive##*/}"
          echo "${ZOLA_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" zola
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Bootstrap kizz and install pinned tools
        run: |
          ./bootstrap.sh --root "${RUNNER_TEMP}/kizz-bootstrap"
          echo "${RUNNER_TEMP}/kizz-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Run kizz CI
        env:
          ZOLA_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: kizz build ci
      - name: Package
        run: |
          name="kizz-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "${name}"
          cp target/release/kizz README.md LICENSE "${name}/"
          tar -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: kizz-${{ github.ref_name }}-${{ env.TARGET }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            kizz-${{ github.ref_name }}-${{ env.TARGET }}.tar.gz
            SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "kizz ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/kizz-* dist/SHA256SUMS

  deploy-site:
    name: Deploy documentation site
    needs: [build, release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
