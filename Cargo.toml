[workspace]
members = [
    "crates/kizz",
    "crates/kizz-core",
    "crates/kizz-store",
    "crates/kizz-threads",
    "crates/kizz-trace",
    "crates/kizz-trace-linux",
]
exclude = ["vendor/surrealkv"]
resolver = "3"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
collapsible_if = "warn"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
field_reassign_with_default = "warn"
format_in_format_args = "warn"
get_unwrap = "deny"
index_refutable_slice = "deny"
indexing_slicing = "deny"
len_zero = "warn"
match_wild_err_arm = "deny"
missing_docs_in_private_items = "deny"
missing_panics_doc = "deny"
needless_question_mark = "warn"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
string_slice = "deny"
todo = "deny"
too_many_arguments = "warn"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unnecessary_cast = "warn"
unreachable = "deny"
unwrap_used = "deny"

[workspace.lints.clippy.pedantic]
level = "deny"
priority = -1

[workspace.lints.rust]
let_underscore_drop = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
warnings = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
unescaped_backticks = "deny"

[workspace.package]
authors = ["Sakura Industries LLC"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Sakura-Industries-LLC/kizz"
rust-version = "1.100.0"

[profile.release]
codegen-units = 1
lto = true
strip = true

[patch.crates-io]
surrealkv = { path = "vendor/surrealkv" }
