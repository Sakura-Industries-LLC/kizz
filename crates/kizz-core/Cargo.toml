[package]
name = "kizz-core"
version = "0.0.1"
description = "The kizz build engine, independent of how commands are run and traced."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kizz-store = { path = "../kizz-store", version = "0.0.1" }
kizz-trace = { path = "../kizz-trace", version = "0.0.1" }
blake3 = { version = "1.8.2", features = ["rayon", "mmap"] }
ignore = "0.4.33"
pulldown-cmark = { version = "0.13.5", default-features = false }
starlark = "0.14.2"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
