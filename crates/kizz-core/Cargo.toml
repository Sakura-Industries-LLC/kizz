[package]
name = "kizz-core"
version = "0.0.1"
description = "The kizz build engine, independent of how commands are run and traced."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kizz-store = { path = "../kizz-store", version = "0.0.1" }
kizz-trace = { path = "../kizz-trace", version = "0.0.1" }
blake3 = { version = "1.8.2", features = ["rayon", "mmap"] }
dashmap = "6.2.1"
globset = "0.4.20"
ignore = "0.4.33"
minicbor = { version = "2.3.1", features = ["alloc", "derive"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
rayon = "1.12.0"
regex = "1.13.1"
serde_json = "1.0.154"
starlark = "0.14.2"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
